<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess · Adda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2361c9a8'/%3E%3Ccircle cx='50' cy='34' r='16' fill='%23fffaf0' stroke='%232b2240' stroke-width='6'/%3E%3Cpath d='M36 84 Q38 60 44 50 L56 50 Q62 60 64 84 Z' fill='%23fffaf0' stroke='%232b2240' stroke-width='6'/%3E%3C/svg%3E">
<script>document.write('<script src="../config.js?v='+Date.now()+'"><\/script>')</script>
<script src="pieces.js?v=4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Mulish:wght@500;600;700;800&display=swap">
<style>
/* VOICE: friendly rivalry, a scoreboard that cheers for both of you
   IDEA: two sticker cards facing off, little chess pieces with faces cheering, a race line of who's ahead
   COLOUR and TYPE: the quiet "Watercolour" theme in watercolor.css (cream paper, soft washes, charcoal lines, brush-stroke interactions); Caveat and Mulish
   LAYOUT: face-off, play button, fun stats, log a result next to the race chart, game history */
:root{color-scheme:light dark;--bg:light-dark(#fff6e8,#1c1532);--dot:light-dark(#ffe0cb,#2c2350);--ink:light-dark(#2b2240,#fdf6ff);--mut:light-dark(#6b5f80,#c3b8db);--line:#2b2240;--sh:light-dark(#2b2240,#8c6ff0);
  --pink:#ff5d8f;--sky:#4cc9f0;--mint:#3ddc97;--lemon:#ffd23f;--orange:#ff9f1c;--grape:#9b5de5;--card:light-dark(#ffffff,#2a2148);--soft:light-dark(#fff3dc,#241c40)}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:16px/1.5 Mulish,system-ui,sans-serif;background:radial-gradient(var(--dot) 2px,transparent 2.4px) 0 0/24px 24px,var(--bg);overflow-x:clip}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(4vw,16px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 0;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:3px solid var(--line);background:var(--c,var(--card));color:var(--ink);text-decoration:none;font:600 15px Mulish,sans-serif;box-shadow:3px 3px 0 var(--sh);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
.pill.c{color:#2b2240}
.pill:hover{transform:translate(-1px,-2px)}.pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
h1{margin:18px 0 0;text-align:center;font:700 clamp(30px,6vw,48px)/1.05 Mulish,sans-serif;color:var(--mint);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:4px 4px 0 var(--sh);overflow-wrap:anywhere}
.tabs{display:flex;justify-content:center;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.tabs button{min-height:38px;padding:0 14px;border-radius:999px;border:3px solid var(--line);background:var(--card);font:600 15px Mulish,sans-serif;box-shadow:2px 2px 0 var(--sh)}
.tabs button[aria-pressed=true]{background:var(--lemon);color:#2b2240}
/* face-off */
.face{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;margin-top:22px}
.pl{position:relative;display:grid;justify-items:center;gap:4px;padding:22px 14px 18px;border-radius:28px;border:4px solid var(--line);background:var(--c);color:#2b2240;box-shadow:7px 7px 0 var(--sh);text-align:center;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.pl.happy{animation:happy .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes happy{30%{transform:translateY(-18px) rotate(-3deg) scale(1.04)}60%{transform:translateY(0) scale(1.02,.96)}}
.pl::before{content:'';position:absolute;inset:0;border-radius:24px;background:radial-gradient(rgb(255 255 255/.35) 2px,transparent 2.5px) 0 0/18px 18px;pointer-events:none}
.ava{position:relative;width:78px;height:78px;border:0;background:none;padding:0;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.ava:hover{transform:rotate(-8deg) scale(1.08)}
.ava svg{width:100%;height:100%}
.crown{position:absolute;top:-34px;left:50%;translate:-50% 0;width:46px;height:36px;rotate:-10deg;filter:drop-shadow(2px 2px 0 var(--line));animation:wob 2.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-4px) rotate(14deg)}}
.pname{position:relative;font:700 22px/1.1 Mulish,sans-serif;overflow-wrap:anywhere}
.pts{position:relative;border:0;background:none;padding:0;font:700 clamp(54px,11vw,86px)/1 Mulish,sans-serif;color:#fff;-webkit-text-stroke:4px var(--line);paint-order:stroke fill;text-shadow:5px 5px 0 var(--line);cursor:pointer}
.pts span{display:inline-block}
.rec{position:relative;font-weight:800;font-size:15px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rec b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:8px;border:2px solid var(--line);background:#fff;font:700 14px Mulish,sans-serif}
.vs{font:700 30px Mulish,sans-serif;color:var(--lemon);-webkit-text-stroke:2.5px var(--line);paint-order:stroke fill;text-shadow:3px 3px 0 var(--sh);border:0;background:none;padding:6px;cursor:pointer}
.playrow{display:flex;justify-content:center;margin-top:22px}
.play{display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 26px 0 16px;border-radius:999px;border:4px solid var(--line);background:var(--mint);color:#2b2240;text-decoration:none;font:700 22px Mulish,sans-serif;box-shadow:5px 5px 0 var(--sh);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.play svg{width:42px;height:42px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.play:hover{transform:translate(-2px,-3px) rotate(-1deg)}.play:hover svg{transform:translateY(-6px) rotate(-12deg)}
.play:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--sh)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;margin-top:30px}
.st{border:3px solid var(--line);border-radius:20px;background:var(--card);padding:12px 14px;box-shadow:4px 4px 0 var(--sh);display:grid;gap:2px;transition:transform .3s cubic-bezier(.3,1.7,.5,1);cursor:default}
.st:hover{transform:translateY(-3px) rotate(-1deg)}
.st small{font-weight:800;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.st b{font:700 24px/1.15 Mulish,sans-serif;overflow-wrap:anywhere}
.st span{font-size:14px;color:var(--mut);font-weight:700}
/* cards */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px;margin-top:30px;padding-bottom:20px}
.card{border:4px solid var(--line);border-radius:26px;background:var(--card);padding:22px;box-shadow:7px 7px 0 var(--sh)}
.card.wide{grid-column:1/-1}
h2{margin:0 0 12px;font:700 26px/1.1 Mulish,sans-serif}
.who{display:grid;gap:10px}
.res{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px 0 8px;border-radius:18px;border:3px solid var(--line);background:var(--c);color:#2b2240;font:700 19px Mulish,sans-serif;box-shadow:3px 3px 0 var(--sh);transition:transform .2s cubic-bezier(.3,1.7,.5,1);text-align:left}
.res:hover{transform:translate(-1px,-2px)}.res:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.res svg{width:44px;height:44px;flex:none}
.res span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:14px;font-weight:800;color:var(--mut)}
.opts input,.opts select{min-height:46px;border:3px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--soft);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
.race{position:relative;min-height:260px}
.race svg{position:absolute;inset:0;width:100%;height:100%}
.empty{display:grid;place-items:center;text-align:center;min-height:200px;color:var(--mut);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-weight:800;font-size:14px;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;border:2px solid var(--line);vertical-align:-2px;margin-right:5px}
.hist{display:grid;gap:10px}
.g{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:3px solid var(--line);background:var(--soft)}
.g.fresh{animation:slidein .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes slidein{from{transform:translateX(-30px) rotate(-2deg);opacity:0}}
.g .badge{width:46px;height:46px;border-radius:14px;border:3px solid var(--line);background:var(--c);display:grid;place-items:center}
.g .badge svg{width:38px;height:38px}
.g b{font:700 17px/1.2 Mulish,sans-serif}
.g small{display:block;color:var(--mut);font-weight:700;font-size:13px}
.g button{border:0;background:none;color:var(--mut);min-width:44px;min-height:44px;border-radius:12px}
.g button:hover{background:light-dark(#ffe3ec,#3a2350);color:#e0244a}
.more{margin-top:12px}
/* dialogs and bits */
.modal{position:fixed;inset:0;z-index:40;background:rgb(28 21 50/.55);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.box{width:min(400px,100%);background:var(--card);border:4px solid var(--line);border-radius:24px;padding:22px;box-shadow:7px 7px 0 var(--sh);text-align:center;animation:boxin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boxin{from{transform:translateY(30px) scale(.85) rotate(-4deg);opacity:0}}
.box h3{margin:0 0 6px;font:700 24px/1.2 Mulish,sans-serif}.box p{margin:0 0 16px;color:var(--mut);font-weight:700}
.box input{width:100%;min-height:48px;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--soft);margin-bottom:12px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:3px solid var(--line);background:var(--c,var(--card));font:600 16px Mulish,sans-serif;box-shadow:3px 3px 0 var(--sh)}
.btn.c{color:#2b2240}
.bit{position:fixed;pointer-events:none;z-index:35;font:700 22px/1 Mulish,sans-serif}
.toast{position:fixed;left:50%;bottom:20px;z-index:45;translate:-50% 0;padding:10px 12px 10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-weight:800;box-shadow:3px 3px 0 var(--sh);display:flex;gap:10px;align-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;max-width:calc(100vw - 32px)}
.toast:not(.on){transform:translateY(160%);opacity:0;pointer-events:none}
.toast button{min-height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--lemon);color:#2b2240;font:600 14px Mulish,sans-serif}
.foot{text-align:center;color:var(--mut);font-size:13px;font-weight:700;padding:10px 16px 40px}
.missing{text-align:center;padding:80px 16px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.face{gap:8px}.vs{font-size:20px;padding:2px}.pl{padding:18px 8px 14px;border-radius:22px;box-shadow:5px 5px 0 var(--sh)}.ava{width:60px;height:60px}.pname{font-size:18px}.pts{-webkit-text-stroke:3px var(--line);text-shadow:4px 4px 0 var(--line)}.rec{font-size:13px;gap:5px}.crown{width:38px;height:30px;top:-28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="watercolor.css?v=4">
<script src="watercolor.js?v=4"></script>
</head>
<body>
<div class="wrap" id="page">
  <div class="bar"><a class="pill" href="./">‹ Chess</a><a class="pill" href="../">Adda</a></div>
  <h1 id="title">Chess</h1>
  <div class="tabs" id="tabs" role="group" aria-label="Time period"><button data-v="all" aria-pressed="true">All time</button><button data-v="year" aria-pressed="false">This year</button><button data-v="month" aria-pressed="false">This month</button><button data-v="week" aria-pressed="false">This week</button></div>
  <div class="face" id="face"></div>
  <div class="playrow"><a class="play" id="playlink" href="play.html"><span id="playart"></span>Play a game</a></div>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <section class="card"><h2>Log a game</h2><div class="who" id="who"></div>
      <div class="opts"><label>Date<input type="date" id="din"></label><label>How it ended<select id="how"><option>Checkmate</option><option>Resigned</option><option>Out of time</option><option>Draw agreed</option><option>Stalemate</option><option>Other</option></select></label></div></section>
    <section class="card"><h2>The race</h2><div class="legend" id="legend"></div><div class="race" id="race"></div></section>
    <section class="card wide"><h2>Game history</h2><div class="hist" id="hist"></div><button class="btn more" id="more" hidden>Show all</button></section>
  </div>
  <p class="foot" id="sync"></p>
</div>
<section class="missing" id="missing" hidden><h1>This board isn’t set up</h1><p><a class="pill" href="./">See all chess dashboards</a></p></section>
<div class="modal" id="dlg" hidden role="dialog" aria-modal="true"><div class="box" id="dbox"></div></div>
<div class="modal" id="kdlg" hidden role="dialog" aria-modal="true" aria-labelledby="kt"><form class="box" id="kform"><h3 id="kt">Passcode</h3><p id="kmsg"></p><input id="kin" type="password" autocomplete="current-password" aria-label="Passcode"><div class="row"><button type="button" class="btn" id="kno">Not now</button><button class="btn c" style="--c:var(--mint)">Save passcode</button></div></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ART=window.ChessArt,CFG=window.SCORE_CONFIG||{},API=(CFG.apiUrl||'').trim();
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const BID=new URLSearchParams(location.search).get('b')||'';
if(!BID)location.replace('./');
const K={cache:'st-cache-'+BID,queue:'st-queue-'+BID,key:'st-key-'+BID,info:'adda-board-'+BID};
const COL=['var(--pink)','var(--sky)'],HEX=['#e07a96','#6c9bd2'],PIECE=['q','n'];
let board=ls.get(K.info,null),entries=(ls.get(K.cache,[])||[]).filter(Boolean),queue=ls.get(K.queue,[]),view='all',all=false,fresh=null,flushing=false,noFallback=false;
const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=n=>n%1?(Math.floor(n)?Math.floor(n):'')+'½':String(n);
const N=()=>board?board.players:['',''];
$('#din').value=key(new Date());
function since(v){const t=new Date();if(v==='week'){const s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));return key(s)}if(v==='month')return key(new Date(t.getFullYear(),t.getMonth(),1));if(v==='year')return t.getFullYear()+'-01-01';return ''}
const inView=()=>entries.filter(e=>!since(view)||e.d>=since(view));
const sorted=l=>[...l].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.t||0)-(b.t||0));
const winner=e=>e.s[0]>e.s[1]?0:e.s[1]>e.s[0]?1:-1;

// ---- render ----
function render(){
  if(!board)return;
  const names=N(),list=sorted(inView()),pts=[0,0],w=[0,0];let d=0;
  list.forEach(e=>{pts[0]+=e.s[0];pts[1]+=e.s[1];const x=winner(e);x<0?d++:w[x]++});
  document.title=`${board.name} · Chess · Adda`;$('#title').textContent=board.name;
  $('#playlink').href='play.html?b='+encodeURIComponent(BID);$('#playart').innerHTML=ART.svg('n','w');
  $$('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  const lead=pts[0]===pts[1]?-1:pts[0]>pts[1]?0:1;
  const card=i=>`<div class="pl" id="pl${i}" style="--c:${COL[i]}">${i===lead?'<svg class="crown" viewBox="0 0 40 32" aria-hidden="true"><path d="M4 26L2 8l10 8 8-13 8 13 10-8-2 18z" fill="#ffd23f" stroke="#2b2240" stroke-width="3" stroke-linejoin="round"/></svg>':''}
    <button class="ava" data-p="${i}" aria-label="Cheer for ${esc(names[i])}">${ART.svg(PIECE[i],i?'b':'w')}</button><span class="pname">${esc(names[i])}</span>
    <button class="pts" data-p="${i}" aria-label="${fmt(pts[i])} points">${[...fmt(pts[i])].map(c=>`<span>${c}</span>`).join('')}</button>
    <span class="rec"><span><b>${w[i]}</b> won</span><span><b>${d}</b> drawn</span><span><b>${w[1-i]}</b> lost</span></span></div>`;
  $('#face').innerHTML=card(0)+`<button class="vs" id="vs" aria-label="Spin">vs</button>`+card(1);
  stats(list,names);race(list,names);who(names);hist(names);
}
function streaks(list){let cur={p:-1,n:0},best={p:-1,n:0};list.forEach(e=>{const x=winner(e);if(x<0){cur={p:-1,n:0};return}cur=cur.p===x?{p:x,n:cur.n+1}:{p:x,n:1};if(cur.n>best.n)best={...cur}});return{cur,best}}
function stats(list,names){
  const s=streaks(list),moves=list.map(e=>Number((/(\d+) moves/.exec(e.note||'')||[])[1])).filter(Boolean);
  const whiteWins=list.filter(e=>{const m=/· ([^·]+) white$/.exec(e.note||'');const x=winner(e);return m&&x>=0&&names[x]===m[1].trim()}).length,withColour=list.filter(e=>/ white$/.test(e.note||'')&&winner(e)>=0).length;
  const ends={};list.forEach(e=>{const r=(e.note||'').split(' · ')[0];if(r)ends[r]=(ends[r]||0)+1});const top=Object.entries(ends).sort((a,b)=>b[1]-a[1])[0];
  const items=[['Games played',list.length,list.length?(n=>`${n} draw${n===1?'':'s'}`)(list.filter(e=>winner(e)<0).length):'No games yet'],
    ['Hot streak',s.cur.n>1?`${names[s.cur.p]} × ${s.cur.n}`:s.cur.n?`${names[s.cur.p]} won the last`:'–',s.best.n>1?`Best ever: ${names[s.best.p]} × ${s.best.n}`:'Win two in a row to start one'],
    ['Average game',moves.length?`${Math.round(moves.reduce((a,b)=>a+b,0)/moves.length)} moves`:'–',moves.length?`Longest ${Math.max(...moves)}, shortest ${Math.min(...moves)}`:'Played on the app'],
    ['White’s luck',withColour?`${Math.round(whiteWins/withColour*100)}%`:'–',withColour?'of decided games won by white':'Played on the app'],
    ['Favourite ending',top?top[0]:'–',top?`${top[1]} time${top[1]===1?'':'s'}`:'']];
  $('#stats').innerHTML=items.map(([a,b,c])=>`<div class="st"><small>${a}</small><b>${esc(b)}</b><span>${esc(c)}</span></div>`).join('')}
function race(list,names){
  const el=$('#race');$('#legend').innerHTML=names.map((n,i)=>`<span><i style="background:${HEX[i]}"></i>${esc(n)}</span>`).join('');
  if(!list.length){el.innerHTML='<div class="empty">No games in this period yet.<br>Play one and the race begins!</div>';return}
  const W=el.clientWidth||500,H=el.clientHeight||260,L=30,R=12,T=14,B=26,cum=[[0],[0]];
  list.forEach(e=>{cum[0].push(cum[0].at(-1)+e.s[0]);cum[1].push(cum[1].at(-1)+e.s[1])});
  const n=list.length,mx=Math.max(1,cum[0].at(-1),cum[1].at(-1)),x=i=>L+(W-L-R)*i/n,y=v=>T+(H-T-B)*(1-v/mx);
  let o='';const step=Math.max(1,Math.ceil(mx/4));
  for(let v=0;v<=mx;v+=step)o+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--mut)" stroke-opacity=".25" stroke-width="2" stroke-dasharray="${v?'4 6':''}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" font-weight="800" fill="var(--mut)">${v}</text>`;
  [0,1].forEach(i=>{const pts=cum[i].map((v,k)=>`${x(k)},${y(v)}`).join(' ');
    o+=`<polyline points="${pts}" fill="none" stroke="#3d3a4f" stroke-opacity=".25" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><polyline class="ln" points="${pts}" fill="none" stroke="${HEX[i]}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ${i*.2}s cubic-bezier(.4,.1,.3,1) forwards"/>`;
    o+=`<g transform="translate(${x(n)-17} ${y(cum[i][n])-30})" class="runner">${ART.svg(PIECE[i],i?'b':'w').replace('<svg','<svg width="34" height="34"')}</g>`});
  o+=`<text x="${L}" y="${H-6}" font-size="12" font-weight="800" fill="var(--mut)">Game 1</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="12" font-weight="800" fill="var(--mut)">Game ${n}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running points: ${esc(names[0])} ${fmt(cum[0][n])}, ${esc(names[1])} ${fmt(cum[1][n])}"><style>@keyframes draw{to{stroke-dashoffset:0}}</style>${o}</svg>`}
new ResizeObserver(()=>{if(board)race(sorted(inView()),N())}).observe($('#race'));
function who(names){$('#who').innerHTML=names.map((n,i)=>`<button class="res" data-r="${i}" style="--c:${COL[i]}">${ART.svg(PIECE[i],i?'b':'w')}<span>${esc(n)} won</span></button>`).join('')+`<button class="res" data-r="d" style="--c:var(--lemon)">${ART.svg('k','w')}<span>A draw</span></button>`}
function hist(names){
  const list=sorted(inView()).reverse(),shown=all?list:list.slice(0,15);
  $('#hist').innerHTML=shown.length?shown.map(e=>{const x=winner(e),dt=parse(e.d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    return`<div class="g${e.id===fresh?' fresh':''}"><span class="badge" style="--c:${x<0?'var(--lemon)':COL[x]}">${ART.svg(x<0?'k':PIECE[x],x===1?'b':'w')}</span>
      <span><b>${x<0?'Draw':esc(names[x])+' won'}</b><small>${dt}${e.note?' · '+esc(e.note):''}</small></span><button data-del="${esc(e.id)}" aria-label="Delete game">✕</button></div>`}).join(''):'<p class="empty" style="min-height:80px">Nothing here yet.</p>';
  $('#more').hidden=all||list.length<=15;$('#more').textContent=`Show all ${list.length}`}

// ---- fun ----
function burst(el,syms,cols,n=18){if(reduce()||!el)return;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;
  for(let k=0;k<n;k++){const s=document.createElement('i');s.className='bit';s.textContent=syms[k%syms.length];s.style.color=cols[k%cols.length];s.style.left=x+'px';s.style.top=y+'px';s.style.fontSize=(14+Math.random()*16)+'px';document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*120;s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*v}px),calc(-50% + ${Math.sin(a)*v+60}px)) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:900+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove()}}
$('#face').addEventListener('click',e=>{
  const a=e.target.closest('.ava'),p=e.target.closest('.pts'),v=e.target.closest('#vs');
  if(a&&!reduce()){const i=+a.dataset.p;a.querySelector('svg').animate([{transform:'none'},{transform:'translateY(-30px) rotate(-20deg) scale(1.1)'},{transform:'translateY(0) scale(1.15,.85)'},{transform:'none'}],{duration:650,easing:'ease-out'});burst(a,['♥','★','✦'],[HEX[i],'#ffd23f','#fff'],14)}
  if(p&&!reduce())p.querySelectorAll('span').forEach((s,k)=>s.animate([{transform:'none'},{transform:'translateY(-24px) rotate(-10deg)'},{transform:'none'}],{duration:500,delay:k*90,easing:'cubic-bezier(.3,1.6,.5,1)'}));
  if(v&&!reduce()){v.animate([{transform:'none'},{transform:'rotate(360deg) scale(1.5)'},{transform:'rotate(720deg)'}],{duration:800,easing:'cubic-bezier(.3,1.3,.5,1)'});$$('.pl').forEach((c,k)=>c.animate([{transform:'none'},{transform:`translateX(${k?-14:14}px) rotate(${k?-4:4}deg)`},{transform:'none'}],{duration:500,delay:200}))}});

// ---- sync ----
const myKey=()=>ls.get(K.key,'')||(noFallback?'':ls.get('st-key',''));
function cache(){ls.set(K.cache,entries);ls.set(K.queue,queue);if(board)ls.set(K.info,board)}
function remember(){let r=ls.get('adda-recent',[]);if(!Array.isArray(r))r=[];ls.set('adda-recent',[{id:BID,game:'chess',name:board.name,players:board.players,at:Date.now()}].concat(r.filter(x=>x&&x.id!==BID)).slice(0,12))}
const norm=e=>({id:String(e.id),d:String(e.d),s:(e.s||[0,0]).map(Number),t:Number(e.t)||0,note:e.note||''});
const sig=l=>JSON.stringify(l.map(e=>[e.id,e.d,e.s.join(),e.note]).sort());
function adopt(j){if(!j||!j.ok)return;let ch=false;if(j.board&&JSON.stringify(j.board)!==JSON.stringify(board)){board=j.board;ch=true}
  if(Array.isArray(j.entries)&&!queue.length){const l=j.entries.map(norm);if(sig(l)!==sig(entries)){entries=l;ch=true}}cache();remember();if(ch)render()}
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,board:BID,key:myKey()})});return r.json()}
async function flush(){if(!API||flushing||!queue.length)return;if(!myKey())return askKey();flushing=true;$('#sync').textContent='Saving…';
  try{while(queue.length){const res=await post(queue[0]);if(!res.ok){if(res.error==='bad_key'){if(ls.get(K.key,''))ls.set(K.key,'');else noFallback=true;flushing=false;askKey(true);return}queue.shift();cache();continue}queue.shift();cache();if(!queue.length)adopt(res)}$('#sync').textContent='Synced with Google Sheet'}
  catch(e){$('#sync').textContent='Offline: will sync when the sheet is reachable';setTimeout(flush,15000)}finally{flushing=false}}
async function pull(){if(!API||queue.length||flushing)return;try{const r=await fetch(API+(API.includes('?')?'&':'?')+'board='+encodeURIComponent(BID)+'&t='+Date.now()),j=await r.json();
  if(!j.ok&&j.error==='no_board'){$('#page').hidden=true;$('#missing').hidden=false;return}adopt(j);$('#sync').textContent='Synced with Google Sheet'}catch(e){$('#sync').textContent='Offline: showing the last saved games'}}
function enqueue(op){queue.push(op);cache();render();flush()}
function askKey(bad){$('#kmsg').textContent=bad?'That passcode didn’t work. Try again.':`Enter the passcode for ${board?board.name:'this board'} once on this device to save games.`;$('#kdlg').hidden=false;setTimeout(()=>$('#kin').focus(),30)}
$('#kform').addEventListener('submit',e=>{e.preventDefault();const k=$('#kin').value.trim();if(!k)return;ls.set(K.key,k);$('#kin').value='';$('#kdlg').hidden=true;flush()});
$('#kno').onclick=()=>{$('#kdlg').hidden=true};
let tt;function toast(m,btn,fn){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`+(btn?`<button>${esc(btn)}</button>`:'');if(btn)t.querySelector('button').onclick=()=>{fn();t.classList.remove('on')};t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),5000)}

// ---- logging and deleting ----
$('#who').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const r=b.dataset.r,how=$('#how').value;
  const s=r==='d'?[.5,.5]:r==='0'?[1,0]:[0,1],en={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:$('#din').value||key(new Date()),s,t:Date.now(),note:r==='d'&&!/Draw|Stalemate/.test(how)?'Draw agreed':how};
  entries.push(en);fresh=en.id;enqueue({action:'add',entry:en});setTimeout(()=>{fresh=null},1500);
  const names=N();
  if(r==='d'){toast('A draw! Half a point each');burst(b,['½','★','✦'],['#ffd23f','#ff5d8f','#4cc9f0'],20)}
  else{const i=+r;toast(`${names[i]} wins! ${['Brilliant!','What a game!','Checkmate royalty','Bow to the champion'][Math.floor(Math.random()*4)]}`);
    const c=$('#pl'+i);if(c){c.classList.remove('happy');void c.offsetWidth;c.classList.add('happy');burst(c,['♛','★','✦','♥'],[HEX[i],'#ffd23f','#fff'],26)}}});
$('#hist').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const g=entries.find(x=>x.id===b.dataset.del);if(!g)return;const x=winner(g),names=N();
  $('#dbox').innerHTML=`<h3>Delete this game?</h3><p>${esc(parse(g.d).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}: ${x<0?'a draw':esc(names[x])+' won'}</p><div class="row"><button class="btn" id="dno">Keep it</button><button class="btn c" style="--c:var(--pink)" id="dyes">Delete</button></div>`;
  $('#dlg').hidden=false;$('#dno').onclick=()=>{$('#dlg').hidden=true};
  $('#dyes').onclick=()=>{$('#dlg').hidden=true;entries=entries.filter(y=>y.id!==g.id);enqueue({action:'delete',id:g.id});toast('Game deleted','Undo',()=>{entries.push(g);enqueue({action:'add',entry:g})})}});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').hidden=true});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;all=false;render()});
$('#more').onclick=()=>{all=true;render()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush();pull()}});
setInterval(()=>{if(!document.hidden)pull()},30000);
if(board){remember();render()}
if(API){flush();pull()}else $('#sync').textContent='Saved on this device only';
}
</script>
</body>
</html>
