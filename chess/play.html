<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess · Adda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2361c9a8'/%3E%3Ccircle cx='50' cy='34' r='16' fill='%23fffaf0' stroke='%232b2240' stroke-width='6'/%3E%3Cpath d='M36 84 Q38 60 44 50 L56 50 Q62 60 64 84 Z' fill='%23fffaf0' stroke='%232b2240' stroke-width='6'/%3E%3C/svg%3E">
<script>document.write('<script src="../config.js?v='+Date.now()+'"><\/script>')</script>
<script src="chess.js?v=4"></script>
<script src="pieces.js?v=4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Mulish:wght@500;600;700;800&display=swap">
<style>
/* VOICE: a playful board game night, teasing but kind
   IDEA: a toy chess set: chunky board with a hard shadow, round little pieces with faces that hop, chomp and wobble
   COLOUR and TYPE: the quiet "Watercolour" theme in watercolor.css (cream paper, soft washes, charcoal lines, brush-stroke interactions); Caveat and Mulish
   LAYOUT: one phone screen: opponent on top, board, you below, a few actions */
:root{color-scheme:light dark;--bg:light-dark(#fff6e8,#1c1532);--dot:light-dark(#ffe0cb,#2c2350);--ink:light-dark(#2b2240,#fdf6ff);--mut:light-dark(#6b5f80,#c3b8db);--line:#2b2240;--sh:light-dark(#2b2240,#8c6ff0);
  --light:#fff3dc;--dark:#7fcdb4;--lemon:#ffd23f;--pink:#ff5d8f;--mint:#3ddc97;--sky:#4cc9f0;--grape:#9b5de5;--orange:#ff9f1c;--card:light-dark(#ffffff,#2a2148)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.4 Mulish,system-ui,sans-serif;background:radial-gradient(var(--dot) 2px,transparent 2.4px) 0 0/24px 24px,var(--bg);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:3px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font:600 15px Mulish,sans-serif;box-shadow:3px 3px 0 var(--sh)}
.top h1{margin:0;font:700 28px/1 Mulish,sans-serif;color:var(--mint);-webkit-text-stroke:2.5px var(--line);paint-order:stroke fill;text-shadow:3px 3px 0 var(--sh)}
.sync{font-size:12px;color:var(--mut);min-width:70px;text-align:right}
/* player strips */
.strip{display:flex;align-items:center;gap:10px;margin:10px 0;min-height:48px}
.av{flex:none;width:44px;height:44px;border-radius:14px;border:3px solid var(--line);background:var(--c,var(--card));box-shadow:3px 3px 0 var(--sh);display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.av svg{width:36px;height:36px}
.strip.turn .av{animation:turnbob 1.2s ease-in-out infinite}
@keyframes turnbob{50%{transform:translateY(-4px) rotate(-6deg)}}
.who{display:grid;gap:1px;flex:1}
.who b{font:700 18px/1.1 Mulish,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;min-height:18px}
.think i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:2px;animation:thk 1s infinite}.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes thk{50%{transform:translateY(-4px);opacity:.4}}
.yourmove{color:light-dark(#0f8a5f,#3ddc97);font-weight:800}
.taken{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:46%}
.taken svg{width:22px;height:22px;margin-left:-8px;animation:inpop .5s cubic-bezier(.3,1.8,.5,1) both}
.taken em{font:700 14px Mulish,sans-serif;font-style:normal;margin-left:4px;color:var(--mut)}
@keyframes inpop{from{transform:scale(0) rotate(-90deg)}}
/* board */
.bwrap{position:relative;width:min(100%,calc(100dvh - 290px));min-width:min(100%,300px);margin:0 auto;aspect-ratio:1}
.board{position:absolute;inset:0;border:4px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:7px 7px 0 var(--sh);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);background:var(--light);touch-action:manipulation}
.sq{position:relative;background:var(--light);display:grid;place-items:center}
.sq.d{background:var(--dark)}
.sq .co{position:absolute;font:700 10px/1 Mulish,sans-serif;color:rgb(43 34 64/.45);pointer-events:none}
.sq .co.f{right:3px;bottom:2px}.sq .co.r{left:3px;top:3px}
.sq.last::after{content:'';position:absolute;inset:0;background:rgb(255 210 63/.55)}
.sq.selsq::after{content:'';position:absolute;inset:0;background:rgb(255 210 63/.85)}
.sq.chk::before{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(#ff5d8f,rgb(255 93 143/0) 70%);animation:chk 1s ease-in-out infinite;z-index:0}
@keyframes chk{50%{transform:scale(1.15);opacity:.6}}
.mv{position:absolute;width:32%;height:32%;border-radius:50%;background:var(--lemon);border:3px solid var(--line);box-shadow:2px 2px 0 rgb(43 34 64/.35);z-index:1;animation:dotin .35s cubic-bezier(.3,1.8,.5,1) both;pointer-events:none}
.mv.cap{width:90%;height:90%;background:none;border:5px solid var(--pink);box-shadow:none;animation:dotin .35s cubic-bezier(.3,1.8,.5,1) both,capring 1s ease-in-out .4s infinite}
@keyframes capring{50%{transform:scale(.9)}}
@keyframes dotin{from{transform:scale(0)}}
.pcs{position:absolute;inset:4px;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;padding:0;will-change:transform}
.pc svg{width:100%;height:100%;display:block;scale:.94;transform-origin:50% 90%;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.pc.sel svg{animation:hopsel .9s ease-in-out infinite}
@keyframes hopsel{0%,100%{transform:translateY(-6%) scale(1.12)}50%{transform:translateY(-16%) scale(1.15) rotate(-4deg)}}
.pc.fallen svg{transform:rotate(85deg) translateY(10%)}
.pc .face{transition:transform .3s}
/* bubbles and banners */
.bub{position:fixed;z-index:30;padding:8px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:#2b2240;font:600 16px/1.2 Mulish,sans-serif;box-shadow:3px 3px 0 var(--line);pointer-events:none;white-space:nowrap;translate:-50% -100%}
.bub::after{content:'';position:absolute;left:50%;top:100%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--line)}
.big{position:absolute;left:50%;top:50%;z-index:5;translate:-50% -50%;padding:10px 22px;border-radius:20px;border:4px solid var(--line);background:var(--c,var(--lemon));color:#2b2240;font:700 34px/1 Mulish,sans-serif;box-shadow:5px 5px 0 var(--line);pointer-events:none;white-space:nowrap}
.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border:3px solid var(--line);border-radius:16px;background:var(--lemon);color:#2b2240;font-weight:800;box-shadow:3px 3px 0 var(--sh);animation:inpop .4s cubic-bezier(.3,1.6,.5,1)}
.offer div{display:flex;gap:8px}
.acts{display:flex;justify-content:center;gap:10px;padding-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:999px;border:3px solid var(--line);background:var(--card);color:#2b2240;font:600 16px Mulish,sans-serif;box-shadow:3px 3px 0 var(--sh);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
.btn:not(.c){color:var(--ink)}.btn.c{background:var(--c)}
.btn:hover{transform:translate(-1px,-2px)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.btn:disabled{opacity:.5;transform:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px;box-shadow:2px 2px 0 var(--line)}
.moves{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none;font:600 14px Mulish,sans-serif;color:var(--mut);min-height:34px}
.moves::-webkit-scrollbar{display:none}
.moves span{flex:none}.moves b{color:var(--ink);font-weight:600}.moves .now{background:var(--lemon);color:#2b2240;border-radius:6px;padding:0 5px}
/* screens */
.screen{flex:1;display:grid;place-items:center;text-align:center;padding:24px 8px}
.screen h2{margin:0 0 8px;font:700 30px/1.15 Mulish,sans-serif}
.screen p{margin:0 0 18px;color:var(--mut);font-weight:700}
.seats{display:grid;gap:12px;width:min(340px,100%);margin:0 auto}
.seat{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 18px 0 10px;border-radius:20px;border:3px solid var(--line);background:var(--c);color:#2b2240;font:700 20px Mulish,sans-serif;box-shadow:4px 4px 0 var(--sh);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.seat:hover{transform:translate(-2px,-3px) rotate(-1deg)}
.seat svg{width:44px;height:44px}
.parade{display:flex;justify-content:center;margin-bottom:14px}
.parade span{width:52px;height:52px;animation:parade 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
@keyframes parade{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}}
/* dialogs */
.modal{position:fixed;inset:0;z-index:40;background:rgb(28 21 50/.55);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.box{position:relative;width:min(400px,100%);background:var(--card);color:var(--ink);border:4px solid var(--line);border-radius:24px;padding:22px;box-shadow:7px 7px 0 var(--sh);text-align:center;animation:boxin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boxin{from{transform:translateY(30px) scale(.85) rotate(-4deg);opacity:0}}
.box h3{margin:0 0 6px;font:700 26px/1.15 Mulish,sans-serif}
.box p{margin:0 0 16px;color:var(--mut);font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.promo{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.promo button{width:66px;height:66px;border-radius:16px;border:3px solid var(--line);background:var(--light);box-shadow:3px 3px 0 var(--line);padding:4px;animation:parade 1.4s ease-in-out infinite;animation-delay:calc(var(--i) * .1s)}
.promo button:hover{background:var(--lemon)}
.trophy{width:84px;height:84px;margin:-62px auto 6px;border-radius:24px;border:4px solid var(--line);background:var(--c,var(--lemon));box-shadow:4px 4px 0 var(--line);display:grid;place-items:center;animation:parade 1.6s ease-in-out infinite}
.trophy svg{width:66px;height:66px}
.box input{width:100%;min-height:48px;border:3px solid var(--line);border-radius:14px;padding:8px 12px;font:inherit;background:light-dark(#fff,#1c1532);color:var(--ink);margin-bottom:12px}
.bit{position:fixed;pointer-events:none;z-index:35;font:700 20px/1 Mulish,sans-serif}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;translate:-50% 0;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;box-shadow:3px 3px 0 var(--sh);transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s;max-width:calc(100vw - 32px)}
.toast:not(.on){transform:translateY(160%);opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="watercolor.css?v=4">
<script src="watercolor.js?v=4"></script>
</head>
<body>
<div class="app">
  <div class="top"><a href="./" id="back">‹ Scores</a><h1>Chess</h1><span class="sync" id="sync"></span></div>

  <section class="screen" id="pick" hidden><div>
    <div class="parade" aria-hidden="true" id="parade"></div>
    <h2>Who’s playing on this phone?</h2><p>Pick once. Playing side by side? Share one phone.</p>
    <div class="seats" id="seats"></div></div></section>

  <section class="screen" id="lobby" hidden><div>
    <div class="parade" aria-hidden="true" id="parade2"></div>
    <h2 id="lt">Setting up the board…</h2><p id="lp">Polishing the pawns.</p>
    <button class="btn c" style="--c:var(--mint);font-size:20px;min-height:56px;padding:0 28px" id="startbtn" hidden>Start a game</button></div></section>

  <section id="game" hidden style="display:flex;flex-direction:column;flex:1;justify-content:center">
    <div class="strip" id="topstrip"></div>
    <div class="bwrap" id="bwrap"><div class="board" id="board" role="grid" aria-label="Chess board"></div><div class="pcs" id="pcs"></div></div>
    <div class="strip" id="botstrip"></div>
    <div class="offer" id="offer" hidden></div>
    <div class="moves" id="moves" aria-label="Moves so far"></div>
    <div class="acts" id="acts"></div>
  </section>
</div>
<div class="modal" id="mdlg" hidden role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>
<div class="modal" id="kdlg" hidden role="dialog" aria-modal="true" aria-labelledby="kt"><form class="box" id="kform"><h3 id="kt">Passcode</h3><p id="kmsg">Enter this dashboard’s passcode once on this phone to play.</p><input id="kin" type="password" autocomplete="current-password" aria-label="Passcode"><div class="row"><button class="btn c" style="--c:var(--mint)">Let’s play</button></div></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const C=window.Chess,ART=window.ChessArt,CFG=window.SCORE_CONFIG||{},API=(CFG.apiUrl||'').trim();
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const BID=new URLSearchParams(location.search).get('b')||'';
if(!BID)location.replace('./');
$('#back').href='board.html?b='+encodeURIComponent(BID);
const SEATK='ch-me-'+BID,KEYK='st-key-'+BID;
let board=ls.get('adda-board-'+BID,null),names=board?board.players:[],seat=ls.get(SEATK,null);
let G=null,ver=0,busy=false,loading=false,loaded=false,noFallback=false,cur=null,sel=null,shownEnd=null,animating=false;
const PN=ART.NAMES;

// ---- server ----
const myKey=()=>ls.get(KEYK,'')||(noFallback?'':ls.get('st-key',''));
async function post(body,ms=30000){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,board:BID,key:myKey()}),signal:ac.signal});return await r.json()}finally{clearTimeout(t)}}
function needKey(){if(!myKey()){$('#kmsg').textContent=`Enter the passcode for ${board?board.name:'this dashboard'} once on this phone to play.`;$('#kdlg').hidden=false;setTimeout(()=>$('#kin').focus(),30);return true}return false}
function badKey(){if(ls.get(KEYK,''))ls.set(KEYK,'');else noFallback=true;needKey()}
$('#kform').addEventListener('submit',e=>{e.preventDefault();const k=$('#kin').value.trim();if(!k)return;ls.set(KEYK,k);$('#kin').value='';$('#kdlg').hidden=true;load()});
async function loadBoard(){if(!API)return;
  try{const r=await fetch(API+(API.includes('?')?'&':'?')+'board='+encodeURIComponent(BID)+'&t='+Date.now()),j=await r.json();
    if(j.ok&&j.board){board=j.board;names=board.players;ls.set('adda-board-'+BID,board);render()}
    else if(j.error==='no_board'){show('lobby');$('#lt').textContent='This board isn’t set up';$('#lp').innerHTML='<a href="./" style="color:inherit">See all chess dashboards</a>'}}catch(e){}}
async function load(){
  if(!API){$('#sync').textContent='Not connected';render();return}
  if(seat==null||needKey()||busy||loading||animating)return;loading=true;
  try{const j=await post({action:'game_get'});if(busy||animating)return;
    if(!j.ok){if(j.error==='bad_key'){badKey();toast('That passcode didn’t work')}return}
    const first=!loaded;loaded=true;$('#sync').textContent='';
    if(first||j.ver!==ver){const prev=G;G=j.game&&j.game.fen?j.game:null;ver=j.ver;arrive(prev,G)}
  }catch(e){$('#sync').textContent='Reconnecting…';if(!loaded)render()}
  finally{loading=false}}
async function save(next,quiet){
  if(needKey())return false;busy=true;const prev=G;G=next;
  try{const j=await post({action:'game_put',game:next,ver});busy=false;
    if(j.ok){ver=j.ver;G=j.game;return true}
    if(j.error==='conflict'){G=j.game;ver=j.ver;cur=null;render();if(!quiet)toast('The board changed, here’s the latest');return false}
    if(j.error==='bad_key')badKey();
    G=prev;cur=null;render();toast('Couldn’t save that move');return false
  }catch(e){busy=false;G=prev;cur=null;render();toast('No connection, try that again');return false}}

// ---- who is who ----
const colorOf=p=>G?(G.white===p?'w':'b'):'w';
const playerOf=col=>G?(col==='w'?G.white:1-G.white):0;
const both=()=>seat==='both';
const myColor=()=>both()?(cur?cur.t:'w'):colorOf(seat);
const canMove=()=>G&&G.status==='playing'&&cur&&(both()||cur.t===colorOf(seat));
const flipped=()=>!both()&&G&&colorOf(seat)==='b';
const nm=col=>names[playerOf(col)]||(col==='w'?'White':'Black');

// ---- lines ----
const L={
  capture:['Splash!','Washed away, {p}','Painted over!','Bye bye, {p}!','Gotcha!','Snack time!','Bye bye, {p}!','Yoink!','Chomp!','Off you pop, {p}','Into the box you go'],
  check:['Check!','Eek, check!','Run, little king!','Check! Sweaty crown'],
  castle:['Castle swap!','Tucked in cozy','King’s hiding now'],
  promo:['Glow up!','Pawn to {p}!','Look who grew up'],
  wait:['Patience! It’s {o}’s move','Shh, {o} is thinking','Wait your turn, little pawn','Not yet! {o} is plotting','Hands in your lap','Your turn is coming, promise'],
  theirs:['Hands off {o}’s {p}!','That {p} isn’t yours','Nice try, that’s {o}’s','No poking the enemy'],
  stuck:['This {p} is stuck','{p} can’t move right now','Nowhere to go!','The {p} says no thanks'],
  save:['Save your king first!','Your king needs you!'],
};
const fill=(s,o)=>s.replace('{o}',o.o||'').replace('{p}',o.p||'');

// ---- rendering ----
function show(id){['pick','lobby','game'].forEach(x=>$('#'+x).hidden=x!==id)}
function parade(el){el.innerHTML='kqrbnp'.split('').map((t,i)=>`<span style="--i:${i}">${ART.svg(t,i%2?'b':'w')}</span>`).join('')}
parade($('#parade'));parade($('#parade2'));
const disp=s=>{const r=s>>3,c=s&7;return flipped()?[7-r,7-c]:[r,c]};
function render(){
  if(!board){show('lobby');$('#startbtn').hidden=true;return}
  if(seat==null){show('pick');
    $('#seats').innerHTML=names.map((n,i)=>`<button class="seat" data-s="${i}" style="--c:${i?'var(--sky)':'var(--pink)'}">${ART.svg(i?'n':'q',i?'b':'w')}${esc(n)}</button>`).join('')+`<button class="seat" data-s="both" style="--c:var(--lemon)">${ART.svg('k','w')}Both of us, one phone</button>`;return}
  if(API&&!loaded){show('lobby');$('#lt').textContent='Setting up the board…';$('#lp').textContent=pick(['Polishing the pawns.','Waking up the knights.','Straightening the crowns.','Counting the squares. 64, yep.']);$('#startbtn').hidden=true;return}
  if(!G){show('lobby');$('#lt').textContent='Ready when you are';$('#lp').textContent=`${names[0]||'Player 1'} plays white first. Colours swap every game.`;$('#startbtn').hidden=false;return}
  show('game');
  if(!cur)cur=C.fromFen(G.fen);
  drawSquares();drawPieces();drawStrips();drawMoves();drawOffer();drawActs();
  if(G.status!=='playing'&&shownEnd!==G.id){shownEnd=G.id;setTimeout(()=>endDialog(true),animating?0:350)}
}
function drawSquares(){
  const last=G.last||{},chk=C.inCheck(cur)?cur.b.indexOf(cur.t==='w'?'K':'k'):-1,mv=sel!=null?C.movesFrom(cur,sel):[];
  let h='';
  for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){
    const r=flipped()?7-dr:dr,c=flipped()?7-dc:dc,s=r*8+c,dark=(r+c)%2===1;
    const cls=['sq',dark?'d':'',s===last.f||s===last.t?'last':'',s===sel?'selsq':'',s===chk?'chk':''].join(' ');
    const m=mv.find(x=>x.t===s);
    h+=`<div class="${cls}" data-s="${s}" role="gridcell" aria-label="${C.name(s)}${cur.b[s]?' '+(C.colorOf(cur.b[s])==='w'?'white ':'black ')+PN[C.typeOf(cur.b[s])]:''}">`+
      (dc===7?'':'')+(dr===7?`<span class="co f">${'abcdefgh'[c]}</span>`:'')+(dc===0?`<span class="co r">${8-r}</span>`:'')+
      (m?`<span class="mv${m.cap?' cap':''}" style="animation-delay:${Math.abs((s>>3)-(sel>>3))*25+Math.abs((s&7)-(sel&7))*25}ms"></span>`:'')+'</div>';
  }
  $('#board').innerHTML=h}
function drawPieces(){
  let h='';
  cur.b.forEach((p,s)=>{if(!p)return;const[r,c]=disp(s),over=G.status!=='playing'&&G.winner&&C.typeOf(p)==='k'&&C.colorOf(p)!==G.winner;
    h+=`<div class="pc${s===sel?' sel':''}${over?' fallen':''}" data-s="${s}" style="transform:translate(${c*100}%,${r*100}%)">${ART.svg(C.typeOf(p),C.colorOf(p))}</div>`});
  $('#pcs').innerHTML=h}
function stripHTML(col){
  const p=playerOf(col),mat=C.material(cur.b)[col],turn=G.status==='playing'&&cur.t===col,me=!both()&&p===seat;
  const state=G.status!=='playing'?(G.winner===col?'Winner!':G.winner?'':'Draw'):turn?(me||both()?'<span class="yourmove">Your move</span>':'<span class="think">thinking<i></i><i></i><i></i></span>'):'';
  return`<span class="av" style="--c:${col==='w'?'var(--pink)':'var(--sky)'}">${ART.svg(G.status!=='playing'&&G.winner===col?'q':'k',col)}</span>
    <span class="who"><b>${esc(nm(col))}</b><small>${col==='w'?'White':'Black'}${state?' · '+state:''}</small></span>
    <span class="taken">${mat.taken.map(t=>ART.svg(C.typeOf(t),C.colorOf(t))).join('')}${mat.score>0?`<em>+${mat.score}</em>`:''}</span>`}
function drawStrips(){const bottom=flipped()?'b':'w',top=bottom==='w'?'b':'w';
  $('#topstrip').innerHTML=stripHTML(top);$('#botstrip').innerHTML=stripHTML(bottom);
  $('#topstrip').classList.toggle('turn',G.status==='playing'&&cur.t===top);$('#botstrip').classList.toggle('turn',G.status==='playing'&&cur.t===bottom)}
function drawMoves(){const ms=G.san||[];$('#moves').innerHTML=ms.map((m,i)=>`${i%2?'':`<span>${i/2+1}.</span>`}<span class="${i===ms.length-1?'now':''}"><b>${esc(m)}</b></span>`).join('');$('#moves').scrollLeft=1e6}
function drawOffer(){const o=$('#offer');const off=G.status==='playing'&&G.drawOffer;
  if(!off||both()){o.hidden=true;return}
  if(off===colorOf(seat)){o.hidden=false;o.innerHTML=`<span>You offered a draw. Waiting…</span><div><button class="btn sm" id="ocancel">Take it back</button></div>`}
  else{o.hidden=false;o.innerHTML=`<span>${esc(nm(off))} offers a draw</span><div><button class="btn sm c" style="--c:var(--mint)" id="oyes">Accept</button><button class="btn sm" id="ono">No thanks</button></div>`}}
function drawActs(){const a=$('#acts');
  if(G.status!=='playing'){a.innerHTML=`<button class="btn c" style="--c:var(--mint)" id="rematch">Rematch ♻</button><a class="btn" href="board.html?b=${encodeURIComponent(BID)}" style="text-decoration:none">Scores</a>`;return}
  a.innerHTML=`<button class="btn" id="draw">${both()?'Call it a draw':'Offer draw'}</button><button class="btn" id="resign">Resign</button><button class="btn" id="newg" aria-label="Start over">↺</button>`}

// ---- arriving states (from server) ----
function arrive(prev,g){
  if(!g){cur=null;render();return}
  if(!prev&&g.status!=='playing')shownEnd=g.id; // an old finished game: no pop-up, just the board
  const old=cur,ms=g.uci||[],pms=prev&&prev.id===g.id?(prev.uci||[]):null;
  if(old&&pms&&ms.length===pms.length+1&&prev.fen===C.toFen(old)){
    const u=ms[ms.length-1],m=C.moves(old).find(x=>C.name(x.f)+C.name(x.t)+(x.promo||'')===u);
    if(m){sel=null;playMove(old,m,()=>{cur=C.fromFen(g.fen);render();react(old,m,cur)});return}}
  if(!prev||prev.id!==g.id){sel=null;if(prev&&g.status==='playing'&&!g.uci.length)toast(`New game! ${nm('w')} plays white`)}
  cur=C.fromFen(g.fen);render()}

// ---- animation ----
function pcEl(s){return $(`#pcs .pc[data-s="${s}"]`)}
function tr(s){const[r,c]=disp(s);return`translate(${c*100}%,${r*100}%)`}
function playMove(st,m,done){
  if(reduce()){done();return}
  animating=true;
  const el=pcEl(m.f),capSq=m.ep?m.t+(st.t==='w'?8:-8):m.t,cap=m.cap?pcEl(capSq):null;
  if(!el){animating=false;done();return}
  el.classList.remove('sel');el.style.zIndex=5;
  const knight=C.typeOf(m.piece)==='n',from=tr(m.f),to=tr(m.t);
  const frames=knight?[{transform:from},{transform:`${from} translateY(-30%)`,offset:.2},{transform:`${to} translateY(-45%) rotate(360deg)`,offset:.8},{transform:to}]
    :[{transform:from},{transform:to}];
  const dur=knight?620:Math.min(420,220+Math.hypot((m.t>>3)-(m.f>>3),(m.t&7)-(m.f&7))*35);
  if(window.Paint){const r1=el.getBoundingClientRect(),[tr2,tc2]=disp(m.t),bw=r1.width;const b0=$('#pcs').getBoundingClientRect();Paint.stroke(r1.left+bw/2,r1.top+bw/2,b0.left+tc2*bw+bw/2,b0.top+tr2*bw+bw/2,st.t==='w'?'#e07a96':'#6c9bd2')}
  const a=el.animate(frames,{duration:dur,easing:knight?'ease-in-out':'cubic-bezier(.3,1.25,.5,1)',fill:'forwards'});
  if(m.castle){const rf=m.castle==='k'?m.f+3:m.f-4,rt=m.castle==='k'?m.f+1:m.f-1,rk=pcEl(rf);
    if(rk)rk.animate([{transform:tr(rf)},{transform:`${tr(rt)} translateY(-35%)`,offset:.5},{transform:tr(rt)}],{duration:dur+120,delay:120,easing:'ease-in-out',fill:'forwards'})}
  if(cap)setTimeout(()=>{if(window.Paint){const q=cap.getBoundingClientRect();Paint.splash(q.left+q.width/2,q.top+q.height/2,C.colorOf(cur.b[capSq]||st.b[capSq])==='w'?'#e07a96':'#6c9bd2')}else sparkle(cap,['●'],['#e07a96','#6c9bd2'],10);cap.animate([{transform:tr(capSq)+' scale(1)',opacity:1},{transform:tr(capSq)+' translateY(-30%) scale(1.15) rotate(-12deg)',offset:.25},{transform:tr(capSq)+' translateY(-260%) scale(.45) rotate(25deg)',opacity:0}],{duration:900,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'})},dur*.6);
  a.onfinish=()=>{animating=false;done()}}
function react(before,m,after){
  const st=C.status(after,G.keys);
  if(G.status==='playing'&&st.check){big('Check!','var(--pink)');const k=pcEl(after.b.indexOf(after.t==='w'?'K':'k'));if(k)shake(k);return}
  if(m.promo){bubbleAt(pcEl(m.t),fill(pick(L.promo),{p:PN[m.promo]}));sparkle(pcEl(m.t),['✦','★'],['#ffd23f','#fff','#9b5de5'],14);return}
  if(m.castle){bubbleAt(pcEl(m.t),pick(L.castle));return}
  if(m.cap)bubbleAt(pcEl(m.t),fill(pick(L.capture),{p:PN[C.typeOf(m.cap)]}))}
function shake(el){if(!el||reduce())return;const s=el.querySelector('svg');s.animate([{transform:'rotate(0)'},{transform:'rotate(-14deg)'},{transform:'rotate(12deg)'},{transform:'rotate(-8deg)'},{transform:'rotate(5deg)'},{transform:'rotate(0)'}],{duration:500})}
function hop(el){if(!el||reduce())return;el.querySelector('svg').animate([{transform:'none'},{transform:'translateY(-22%) scale(1.1,.95)'},{transform:'translateY(0) scale(1.1,.85)'},{transform:'none'}],{duration:450,easing:'ease-out'})}
let bubT=null;
function bubbleAt(el,txt){document.querySelectorAll('.bub').forEach(b=>b.remove());if(!el)return;const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='bub';b.textContent=txt;
  b.style.left=Math.min(Math.max(r.left+r.width/2,90),innerWidth-90)+'px';b.style.top=(r.top-6)+'px';document.body.appendChild(b);
  if(!reduce())b.animate([{transform:'scale(.4) rotate(-8deg)',opacity:0},{transform:'scale(1.08) rotate(2deg)',opacity:1,offset:.2},{transform:'scale(1)',opacity:1,offset:.3},{transform:'scale(1)',opacity:1,offset:.85},{transform:'translateY(-14px)',opacity:0}],{duration:1900,easing:'ease-out'}).onfinish=()=>b.remove();else setTimeout(()=>b.remove(),1800)}
function big(txt,col){if(reduce())return;const b=document.createElement('div');b.className='big';b.textContent=txt;b.style.setProperty('--c',col);$('#bwrap').appendChild(b);
  b.animate([{transform:'scale(.2) rotate(-20deg)',opacity:0},{transform:'scale(1.2) rotate(4deg)',opacity:1,offset:.25},{transform:'scale(1) rotate(-2deg)',opacity:1,offset:.4},{transform:'scale(1)',opacity:1,offset:.8},{transform:'scale(.6)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>b.remove()}
function sparkle(el,syms,cols,n){if(!el||reduce())return;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;
  for(let k=0;k<n;k++){const s=document.createElement('i');s.className='bit';s.textContent=syms[k%syms.length];s.style.color=cols[k%cols.length];s.style.left=x+'px';s.style.top=y+'px';s.style.fontSize=(12+Math.random()*14)+'px';document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,v=30+Math.random()*60;s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*v}px),calc(-50% + ${Math.sin(a)*v}px)) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove()}}
function confetti(){if(reduce())return;for(let k=0;k<70;k++){const s=document.createElement('i');s.className='bit';s.textContent=['♛','★','✦','●','♥','♞'][k%6];s.style.color=['#ff5d8f','#ffd23f','#3ddc97','#4cc9f0','#ff9f1c','#9b5de5'][k%6];s.style.left=(Math.random()*innerWidth)+'px';s.style.top='-20px';s.style.fontSize=(14+Math.random()*16)+'px';document.body.appendChild(s);
  s.animate([{transform:'translateY(0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*120}px,${innerHeight+60}px) rotate(${Math.random()*720}deg)`}],{duration:1800+Math.random()*1400,delay:Math.random()*500,easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish=()=>s.remove()}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

// ---- moving ----
$('#board').addEventListener('click',e=>{const q=e.target.closest('.sq');if(!q||!G||!cur||animating)return;tap(+q.dataset.s)});
function tap(s){
  const p=cur.b[s];
  if(G.status!=='playing'){if(p)hop(pcEl(s));return}
  if(sel!=null){const m=C.movesFrom(cur,sel).filter(x=>x.t===s);
    if(m.length){if(m.length>1)return promo(m);return go(m[0])}}
  if(!p){if(sel!=null){sel=null;drawSquares();drawPieces()}return}
  const col=C.colorOf(p),el=pcEl(s);
  if(!canMove()){shake(el);bubbleAt(el,both()||col!==myColor()?fill(pick(L.theirs),{o:nm(col),p:PN[C.typeOf(p)]}):fill(pick(L.wait),{o:nm(cur.t)}));return}
  if(col!==cur.t){shake(el);bubbleAt(el,fill(pick(L.theirs),{o:nm(col),p:PN[C.typeOf(p)]}));return}
  if(sel===s){sel=null;drawSquares();drawPieces();return}
  if(!C.movesFrom(cur,s).length){shake(el);bubbleAt(el,C.inCheck(cur)?pick(L.save):fill(pick(L.stuck),{p:PN[C.typeOf(p)]}));return}
  sel=s;drawSquares();drawPieces()}
function promo(list){const box=$('#mbox'),col=cur.t;
  box.innerHTML=`<h3>Glow up time!</h3><p>What should your pawn become?</p><div class="promo">${'qrbn'.split('').map((t,i)=>`<button data-p="${t}" style="--i:${i}" aria-label="${PN[t]}">${ART.svg(t,col)}</button>`).join('')}</div>`;
  $('#mdlg').hidden=false;box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#mdlg').hidden=true;go(list.find(m=>m.promo===b.dataset.p))})}
async function go(m){
  const before=cur,after=C.make(before,m),san=C.san(before,m);sel=null;
  const g=JSON.parse(JSON.stringify(G));
  g.fen=C.toFen(after);g.uci=(g.uci||[]).concat(C.name(m.f)+C.name(m.t)+(m.promo||''));g.san=(g.san||[]).concat(san);
  g.keys=(g.keys||[]).concat(C.key(after));g.last={f:m.f,t:m.t};g.drawOffer=null;
  const st=C.status(after,g.keys);
  if(st.over)Object.assign(g,{status:'over',winner:st.winner,reason:st.result});
  drawSquares();
  playMove(before,m,()=>{cur=after;G=g;render();react(before,m,after)});
  const ok=await save(g);if(ok&&g.status==='over')logResult()}

// ---- endings ----
const REASON={checkmate:'Checkmate',stalemate:'Stalemate',insufficient:'Not enough pieces left',fifty:'50 quiet moves',repetition:'Same position three times',resign:'Resigned',agreed:'Draw agreed'};
async function finish(patch){const g={...JSON.parse(JSON.stringify(G)),status:'over',drawOffer:null,...patch};G=g;render();if(await save(g))logResult()}
async function logResult(){if(!G||G.status!=='over'||G.logged)return;
  const s=[0,0];if(G.winner){s[playerOf(G.winner)]=1}else{s[0]=.5;s[1]=.5}
  const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const note=`${REASON[G.reason]||G.reason} · ${Math.ceil((G.uci||[]).length/2)} moves · ${nm('w')} white`;
  try{const j=await post({action:'add',entry:{id:'c'+G.id,d:day,s,t:Date.now(),note}});if(!j.ok)throw 0;
    for(let k=0;k<3;k++){const g={...JSON.parse(JSON.stringify(G)),logged:true};if(await save(g,true))break}
    const n=$('#lognote');if(n)n.textContent='Saved to the scoreboard ✓'}
  catch(e){const n=$('#lognote');if(n)n.textContent='Couldn’t save to the scoreboard yet'}}
function endDialog(celebrate){if(!G||G.status!=='over')return;
  const w=G.winner,title=w?(G.reason==='resign'?`${nm(w==='w'?'b':'w')} resigned`:'Checkmate!'):'It’s a draw',sub=w?`${nm(w)} wins with ${w==='w'?'white':'black'}`:REASON[G.reason]||'Draw';
  const box=$('#mbox');box.style.setProperty('--c',w?'var(--lemon)':'var(--sky)');
  box.innerHTML=`<div class="trophy">${ART.svg(w?'q':'k',w||'w')}</div><h3>${esc(title)}</h3><p>${esc(sub)}${w&&G.reason!=='checkmate'&&G.reason!=='resign'?'':''}</p><p id="lognote" style="font-size:14px;margin-top:-8px">${G.logged?'Saved to the scoreboard ✓':'Saving to the scoreboard…'}</p>
    <div class="row"><button class="btn c" style="--c:var(--mint)" id="rematch2">Rematch ♻</button><button class="btn" id="mclose">Look at the board</button></div>`;
  $('#mdlg').hidden=false;$('#rematch2').onclick=()=>{$('#mdlg').hidden=true;newGame()};$('#mclose').onclick=()=>{$('#mdlg').hidden=true};
  if(celebrate&&w&&(both()||colorOf(seat)===w))confetti();
  if(!G.logged)setTimeout(()=>{const n=$('#lognote');if(n&&G.logged)n.textContent='Saved to the scoreboard ✓'},4000)}
function newGame(){const white=G&&G.white!=null?1-G.white:0;sel=null;cur=null;
  const st=C.start();const g={id:Date.now().toString(36),fen:C.toFen(st),white,uci:[],san:[],keys:[C.key(st)],last:null,status:'playing',winner:null,reason:null,drawOffer:null};
  G=g;render();save(g).then(ok=>{if(ok)toast(`${nm('w')} plays white. Good luck!`)})}
function confirmBox(title,text,yes,fn,col='var(--pink)'){const box=$('#mbox');box.style.removeProperty('--c');box.innerHTML=`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn" id="cno">Never mind</button><button class="btn c" style="--c:${col}" id="cyes">${esc(yes)}</button></div>`;
  $('#mdlg').hidden=false;$('#cno').onclick=()=>{$('#mdlg').hidden=true};$('#cyes').onclick=()=>{$('#mdlg').hidden=true;fn()}}
$('#acts').addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(!id||!G)return;
  if(id==='rematch')newGame();
  if(id==='resign'){const col=both()?cur.t:colorOf(seat);confirmBox('Resign?',`${nm(col)} tips over the king and ${nm(col==='w'?'b':'w')} wins.`,'Resign',()=>finish({winner:col==='w'?'b':'w',reason:'resign'}))}
  if(id==='draw'){if(both())confirmBox('Call it a draw?','Both of you get half a point.','Draw',()=>finish({winner:null,reason:'agreed'}),'var(--sky)');
    else{const g={...JSON.parse(JSON.stringify(G)),drawOffer:colorOf(seat)};G=g;render();save(g).then(ok=>{if(ok)toast('Draw offered')})}}
  if(id==='newg')confirmBox('Start over?','This game is thrown away and won’t count.','Start over',newGame)});
$('#offer').addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(!id)return;
  if(id==='oyes')finish({winner:null,reason:'agreed'});
  if(id==='ono'||id==='ocancel'){const g={...JSON.parse(JSON.stringify(G)),drawOffer:null};G=g;render();save(g)}});
$('#seats').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;seat=b.dataset.s==='both'?'both':+b.dataset.s;ls.set(SEATK,seat);render();load()});
$('#startbtn').onclick=()=>{if(!needKey())newGame()};
$('#mdlg').addEventListener('click',e=>{if(e.target===$('#mdlg'))$('#mdlg').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#mdlg').hidden=true}});
addEventListener('resize',()=>{if(G&&cur&&!animating)render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(()=>{if(!document.hidden&&seat!=null&&!busy&&!loading&&!animating)load()},2500);
render();loadBoard();if(seat!=null)load();
}
</script>
</body>
